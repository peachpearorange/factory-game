name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Read the locked wasm-bindgen version
        id: bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' \
            | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}, wasm-opt

      - name: Build for the web
        env:
          RUSTFLAGS: -C strip=debuginfo
        run: cargo build --release --locked --target wasm32-unknown-unknown --features bevy/webgpu

      - name: Bundle
        run: |
          wasm-bindgen --no-typescript --target web \
            --out-dir dist --out-name factory_game \
            target/wasm32-unknown-unknown/release/factory_game.wasm
          wasm-opt -Os --strip-debug --strip-producers \
            -o dist/factory_game_bg.wasm dist/factory_game_bg.wasm
          cp web/index.html dist/
          cp -r assets dist/assets
          ls -lh dist/factory_game_bg.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
